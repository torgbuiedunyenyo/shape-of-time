services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: shape_of_time
      POSTGRES_PASSWORD: shape_of_time
      POSTGRES_USER: shape_of_time
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shape_of_time -d shape_of_time"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - shape_of_time_postgres:/var/lib/postgresql

volumes:
  shape_of_time_postgres:
